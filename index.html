<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>تسجيل الدخول</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Tahoma, Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #102a43, #176b87);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.25);
        }

        .logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo .icon {
            font-size: 55px;
        }

        .logo h2 {
            color: #176b87;
            margin-top: 10px;
        }

        .logo p {
            color: #777;
            margin-top: 8px;
            font-size: 14px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: bold;
        }

        .input-group input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        .input-group input:focus {
            border-color: #176b87;
            box-shadow: 0 0 5px rgba(23,107,135,0.3);
        }

        .password-box {
            position: relative;
        }

        .password-box button {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 13px;
            color: #176b87;
        }

        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            margin-bottom: 22px;
        }

        .options a {
            color: #176b87;
            text-decoration: none;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: #176b87;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .login-btn:hover {
            background: #104d63;
        }

        .register {
            text-align: center;
            margin-top: 25px;
            font-size: 14px;
            color: #555;
        }

        .register a {
            color: #176b87;
            text-decoration: none;
            font-weight: bold;
        }

        .message {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
        }

        footer {
            text-align: center;
            margin-top: 25px;
            color: #999;
            font-size: 12px;
        }

    </style>
</head>
</html>
